# ─────────────────────────────────────────────
# Spica Theme Config
# ─────────────────────────────────────────────

brand:
  logo: "Astraea"
  avatar: /img/avatar/avatar.jpg

nav:
  - { name: "Home", path: "/", icon: home }
  - { name: "Writing", path: "/archives/", icon: writing }
  - { name: "Projects", path: "/projects/", icon: projects }

hero:
  handle: "@Astraea · GitHub"
  title_prefix: "你好，我是"
  title_name: "织星"
  bio: "记录代码，设计和一些温柔的胡思乱想。"
  tags:
    - { text: "算法", class: "tag-lav" }
    - { text: "TypeScript", class: "tag-lav" }
    - { text: "开源", class: "tag-mint" }
    - { text: "工具", class: "tag-lav" }
    - { text: "学习笔记", class: "tag-pink" }
  status_card:
    enable: true
    discord_id: "1061262757078511706"
    location: "织星阁"
    default_act: "编织星光中..."
    default_detail: "ovo"

social:
  - { name: "GitHub", url: "https://github.com/misterrabbit0w0", icon: github }
  - { name: "邮件", url: "mailto:misterrabbit0w0@gmail.com", icon: mail }

author_widget:
  enable: true
  actions:
    - { label: "GitHub", url: "https://github.com/misterrabbit0w0", icon: github, primary: true }
    - { label: "Star", url: "https://github.com/misterrabbit0w0/misterrabbit0w0.github.io", icon: star }
    - { label: "关于", url: "/about/", icon: home, internal: true }

counter:
  enable: true
  provider: busuanzi
  busuanzi_script: "https://busuanzi.ibruce.info/busuanzi/2.3/busuanzi.pure.mini.js"
  show_post_views: true
  show_site_views: true

about:
  name: "织星"
  handle: "@Astraea"
  bio: ""
  tags:
    - { text: "开发者", class: "tag-pink" }
    - { text: "TypeScript", class: "tag-lav" }
    - { text: "开源", class: "tag-mint" }
    - { text: "算法", class: "tag-lav" }
  sections:
    intro:
      title: "关于我"
      paragraphs:
        - "我是织星（Astraea），做些自己喜欢的东西。"
  skills:
    - { category: "语言", items: ["Python", "C++"] }
    - { category: "前端", items: ["Hexo"] }
    - { category: "工具", items: ["Git", "Docker"] }

footer:
  copyright: "© 2026 织星 / Astraea · 把星光织进字里行间"
  # 站点源码与反馈（页脚胶囊按钮；issues 可省略，默认 repo + /issues）
  repo:
    url: "https://github.com/misterrabbit0w0/misterrabbit0w0.github.io"
    label: "站点源码"
    issues_label: "提 Issue"
  links:
    - { text: "关于", url: "/about/" }
    - { text: "RSS", url: "/atom.xml" }
    - { text: "Sitemap", url: "/sitemap.xml" }

effects:
  petals: 12
  theme: "system"
  # 自定义花瓣光标默认关闭（新奇感税太高），访客仍可在右下角 tweaks 面板手动开启
  cursor: false
  # 暗色夜空里点亮角宿一(Spica)后浮现的悄悄话；留空则关闭此彩蛋
  wish: "愿你抬头 恰逢星光"
